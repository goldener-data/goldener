name: Update the website

# Upload the website to the hosting provider through SFTP. It runs at the end of the release workflow, and it can be
# triggered manually (on the branch or tag chosen in the GitHub UI) to update the website without a release.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # two uploads must not write on the server at the same time
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload the website to the hosting provider through SFTP
    runs-on: ubuntu-latest
    # a hung upload must not block the next deployments waiting on the concurrency group
    timeout-minutes: 30
    environment:
      name: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv with caching
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # docs/api is not committed: it is generated from the checked out code
      - name: Generate API docs
        env:
          # the "View source" links point to the released tag (or the branch chosen for a manual run)
          API_DOCS_SOURCE_REF: ${{ github.ref_name }}
        run: ./scripts/generate_api_docs.sh

      # the server root gets the landing page as index.html, the API docs in the api folder and the images it
      # links to in the statics folder. The landing page links to ../api and ../statics from docs/landing: these
      # paths are made relative to its deployed location, so that they stay in FTP_SERVER_DIR when it is nested.
      - name: Stage the website
        run: |
          mkdir -p _site
          sed -e 's#\.\./api/#api/#g' -e 's#\.\./statics/#statics/#g' docs/landing/index.html > _site/index.html
          if grep -q '\.\./' _site/index.html; then
            echo "docs/landing/index.html links to a parent folder not deployed on the website." >&2
            exit 1
          fi
          cp -r docs/api _site/api
          cp -r docs/statics _site/statics

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # The OVH FTP server does not implement FTPS (it answers "500 This security scheme is not implemented" to
      # AUTH TLS), so the files go through SFTP with the same account. The api and statics folders are only written
      # by this workflow: the files removed from them locally are also removed on the server. index.html is uploaded
      # last so that the landing page never links to files not uploaded yet. The server must match the host key
      # pinned in SFTP_KNOWN_HOSTS: an unknown key is refused instead of trusted, so the password is never sent to
      # another server.
      - name: Upload the website
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
          SFTP_PORT: ${{ vars.SFTP_PORT }}
          SFTP_KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
        run: |
          if [ -z "$SFTP_KNOWN_HOSTS" ]; then
            echo "The SFTP_KNOWN_HOSTS variable must hold the known_hosts line of the server." >&2
            exit 1
          fi
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$known_hosts"
          lftp --env-password -u "$FTP_USERNAME" -p "$SFTP_PORT" "sftp://$FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          lcd _site
          cd "$FTP_SERVER_DIR"
          mirror --reverse --delete --parallel=4 --verbose api api
          mirror --reverse --delete --parallel=4 --verbose statics statics
          put index.html
          bye
          EOF
