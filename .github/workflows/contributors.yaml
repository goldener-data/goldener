name: Contribute List

on:
  push:
    branches: [main]

concurrency:
  group: contributors-readme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  contrib-readme-job:
    runs-on: ubuntu-latest
    name: Automate contributors in README

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Generate contributors list locally
        uses: somaz94/contributors-action@c4b932fc924b894ec7f9c39971b169ba5053a81c # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_file: README.md
          format: table
          columns: '6'
          avatar_size: '100'
          sort_by: name
          include_bots: 'false'
          exclude: actions-user
          update_section: 'true'
          section_start: '<!-- readme: contributors -start -->'
          section_end: '<!-- readme: contributors -end -->'

      - name: Create or update contributors pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: contributors-readme-action-update
          base: main
          add-paths: README.md
          commit-message: 'docs(contributor): update contributors list'
          title: 'docs(contributor): update contributors list'
          body: Update the README contributors list from GitHub contributor data.
