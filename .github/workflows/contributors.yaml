name: Contribute List

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  contrib-readme-job:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    name: Automate contributors in README

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Check whether the contributor is new
        id: contributor
        env:
          CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          contributor_section=$(sed -n '/<!-- readme: contributors -start -->/,/<!-- readme: contributors -end -->/p' README.md)
          if grep -Fqi "href=\"https://github.com/${CONTRIBUTOR}\"" <<< "$contributor_section"; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update contributors list
        if: steps.contributor.outputs.is_new == 'true'
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
